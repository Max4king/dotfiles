"$schema" = 'https://starship.rs/config-schema.json'

#   , 󱆃 , 󰄲 ,  , 󰣇 , 󰕈 , 󰣛 , 

format = """
[░▒▓](#a3aed2)\
[ 󰣇 ](bg:#a3aed2 fg:#090c0c)\
[ ](bg:#769ff0 fg:#a3aed2)\
$directory\
[ ](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[ ](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
[ ](fg:#212736)\
$fill\
$status\
$time\
\n$character"""


# [os]
# disabled = false
# style = "bg:#a3aed2 fg:#090c0c"
# format = "[ $symbol ]($style)"
# 
# [os.symbols]
# # Alpaquita = " "
# # Alpine = " "
# Amazon = " "
# Android = " "
# Arch = "󰣇 "
# # Artix = " "
# # CentOS = " "
# # jDebian = " "
# Fedora = "󰣛 "
# # FreeBSD = " "
# # Garuda = " "
# # Gentoo = " "
# # HardenedBSD = "󰞇 "
# # Illumos = "󰈸 "
# Linux = " " # This is your "Default" Linux fallback
# # Macos = " "
# # Manjaro = " "
# # NixOS = " "
# # OpenBSD = " "
# # openSUSE = " "
# # OracleLinux = "󰮭 "
# # Pop = " "
# # Raspbian = " "
# # Redhat = " "
# # RedHatEnterprise = " "
# # Solus = " "
# # Suse = " "
# Ubuntu = "󰕈 "
# Unknown = " " # Fallback for completely unrecognized systems
# # Windows = "󰍲 "

# The "fill" module pushes everything after it to the right
[fill]
symbol = " "

[username]
show_always = true
style_user = "bg:#a3aed2"
style_root = "bg:#9A348E"
format = '[ $user ]($style)'
disabled = false

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[status]
disabled = false
format = '[](fg:#ff5555)[ $symbol $int ](bg:#ff5555 fg:#ffffff)'
symbol = "✘"
map_symbol = true

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[](fg:#1d2230)[  $time ](bg:#1d2230 fg:#82aaff)[](fg:#1d2230)'
